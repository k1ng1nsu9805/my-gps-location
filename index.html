<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>현재 위치 좌표 확인</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f9fc; color: #172338; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 460px); background: #fff; border: 1px solid #e5eaf1; border-radius: 24px; padding: 30px; box-shadow: 0 14px 42px rgba(25, 48, 83, .06); }
    .eyebrow { display: inline-block; padding: 6px 10px; background: #edf5ff; border-radius: 99px; color: #1964be; font-size: 12px; font-weight: 700; }
    h1 { font-size: 25px; letter-spacing: -.8px; margin: 18px 0 7px; }
    .description { margin: 0 0 25px; line-height: 1.6; font-size: 14px; color: #687589; }
    .coords { display: grid; gap: 12px; }
    .field { padding: 17px 18px; background: #f7f9fc; border: 1px solid #edf0f5; border-radius: 15px; }
    .field-label { font-size: 12px; font-weight: 600; color: #687589; margin-bottom: 8px; }
    .field-value { font-size: clamp(20px, 5vw, 26px); letter-spacing: -.6px; font-weight: 750; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .meta { display: grid; gap: 8px; margin: 20px 0; font-size: 13px; color: #59687d; }
    .meta-row { display: flex; justify-content: space-between; gap: 12px; }
    .meta-row strong { color: #24344b; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
    .status { display: flex; gap: 9px; align-items: center; min-height: 43px; padding: 11px 12px; border-radius: 11px; background: #eef4fd; color: #225f9f; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .status::before { content: ''; display: block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status.error { background: #fff0ef; color: #a23b34; }
    .status.success { background: #ecf8f1; color: #237a4a; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { border: 0; padding: 14px 12px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #90bbf7; outline-offset: 2px; }
    .primary { background: #2578e5; color: white; }
    .primary:hover:not(:disabled) { background: #1668d4; }
    .secondary { background: #eaf0f8; color: #2c4261; }
    .secondary:hover:not(:disabled) { background: #dce6f3; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .notice { margin: 18px 0 0; font-size: 12px; color: #7b8798; line-height: 1.65; }
    @media (max-width: 360px) { main { padding: 22px; } .buttons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">GPS · 위치 확인</span>
    <h1>내 현재 위치 좌표</h1>
    <p class="description">버튼을 누르고 위치 접근을 허용하면 휴대폰에서 확인한 위도와 경도를 표시합니다.</p>

    <section class="coords" aria-label="현재 위치 좌표">
      <div class="field">
        <div class="field-label">위도 Latitude (°)</div>
        <div class="field-value" id="latitude">—</div>
      </div>
      <div class="field">
        <div class="field-label">경도 Longitude (°)</div>
        <div class="field-value" id="longitude">—</div>
      </div>
    </section>

    <div class="meta">
      <div class="meta-row"><span>위치 정확도 (추정)</span><strong id="accuracy">—</strong></div>
      <div class="meta-row"><span>측정 시각</span><strong id="time">—</strong></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">위치 조회 버튼을 눌러주세요.</div>

    <div class="buttons">
      <button class="primary" id="getLocation" type="button">📍 현재 위치 조회</button>
      <button class="secondary" id="copy" type="button" disabled>좌표 복사</button>
    </div>
    <p class="notice">주소 검색이나 지도 API 키가 필요 없습니다. 좌표는 외부 서버로 전송되지 않습니다. 위치 조회에는 브라우저의 위치 권한과 보안 연결(HTTPS 또는 localhost)이 필요할 수 있습니다. GPS 외에 Wi-Fi 등으로 측정될 수 있습니다.</p>
  </main>

  <script>
    const latitudeEl = document.getElementById('latitude');
    const longitudeEl = document.getElementById('longitude');
    const accuracyEl = document.getElementById('accuracy');
    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');
    const locationButton = document.getElementById('getLocation');
    const copyButton = document.getElementById('copy');
    let latestCoordinates = null;

    function showStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    locationButton.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        showStatus('이 브라우저는 위치 조회를 지원하지 않습니다.', 'error');
        return;
      }
      if (!window.isSecureContext) {
        showStatus('보안 연결이 아닙니다. HTTPS 또는 localhost에서 열어주세요.', 'error');
        return;
      }
      locationButton.disabled = true;
      locationButton.textContent = '위치 확인 중…';
      showStatus('위치 접근 권한을 허용하고 잠시 기다려주세요.');

      navigator.geolocation.getCurrentPosition(
        ({ coords, timestamp }) => {
          const latitude = coords.latitude;
          const longitude = coords.longitude;
          latestCoordinates = { latitude, longitude };
          latitudeEl.textContent = latitude.toFixed(8);
          longitudeEl.textContent = longitude.toFixed(8);
          accuracyEl.textContent = `±${Math.round(coords.accuracy).toLocaleString('ko-KR')} m`;
          timeEl.textContent = new Date(timestamp).toLocaleString('ko-KR');
          copyButton.disabled = false;
          showStatus('현재 위치를 확인했습니다.', 'success');
          locationButton.disabled = false;
          locationButton.textContent = '📍 다시 측정';
        },
        (error) => {
          const messages = {
            1: '위치 권한이 거부되었습니다. 브라우저 설정에서 위치 접근을 허용해주세요.',
            2: '위치를 확인할 수 없습니다. 기기 위치 서비스를 켜고 다시 시도해주세요.',
            3: '위치 확인 시간이 초과되었습니다. 다시 시도해주세요.'
          };
          showStatus(messages[error.code] || '위치 조회 중 오류가 발생했습니다.', 'error');
          locationButton.disabled = false;
          locationButton.textContent = '📍 다시 시도';
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
      );
    });

    copyButton.addEventListener('click', async () => {
      if (!latestCoordinates) return;
      const value = `${latestCoordinates.latitude.toFixed(8)}, ${latestCoordinates.longitude.toFixed(8)}`;
      try {
        await navigator.clipboard.writeText(value);
        showStatus('위도, 경도를 복사했습니다.', 'success');
      } catch {
        showStatus(`복사에 실패했습니다. 좌표: ${value}`, 'error');
      }
    });
  </script>
</body>
</html>
